<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RTSP Stream - School Surveillance</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" href="/shared/styles.css">
        <script src="/shared/auth.js"></script>
        <script type="text/javascript" src="https://flashphoner.com/downloads/builds/flashphoner_client/wcs_api-2.0/current/flashphoner.js"></script>
        <script type="text/javascript" src="/js/rtsp-player.js"></script>
        <style>
            .fp-Video {
                border: 1px solid #ddd;
                width: 100%;
                max-width: 1280px;
                height: 720px;
                margin: 0 auto;
                border-radius: 8px;
                overflow: hidden;
            }
            .display {
                width: 100%;
                height: 100%;
                display: inline-block;
                background: #000;
            }
            .display > video,
            object {
                width: 100%;
                height: 100%;
            }
            .controls {
                margin-top: 20px;
                text-align: center;
            }
        </style>
    </head>
    <body onload="init_api()">
        <!-- Load shared navigation -->
        <div id="nav-placeholder"></div>

        <!-- Main Content -->
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="bi bi-camera-video me-2"></i>Live RTSP Stream</h2>
                <div id="stream-status" class="status-badge bg-secondary">
                    <i class="bi bi-circle-fill me-2"></i>Stream Inactive
                </div>
            </div>

            <div class="camera-container">
                <div class="fp-Video">
                    <div id="play" class="display"></div>
                </div>
                <div class="controls">
                    <button class="btn btn-primary" id="playBtn">
                        <i class="bi bi-play-circle me-2"></i>Start Stream
                    </button>
                    <button class="btn btn-danger ms-2" id="stopBtn" style="display: none;">
                        <i class="bi bi-stop-circle me-2"></i>Stop Stream
                    </button>
                </div>
            </div>
        </main>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script>
            // Load shared navigation
            $(function(){
            $("#nav-placeholder").load("/shared/nav.html", function() {
                // After nav is loaded, update its connection status if socket exists
                if (socket && socket.connected) {
                    window.updateNavConnectionStatus(true);
                }
            });
        });
        </script>
    </body>
</html>
